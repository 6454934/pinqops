name: Caddy image

# Builds pinqops' own Caddy and publishes it to GHCR.
#
# Stock caddy:2-alpine cannot do two things pinqops needs: rate limiting (no such
# module ships with Caddy) and DNS-01 challenges (each DNS provider is a separate
# module). Both have to be compiled in, which is what xcaddy does — so the image is
# built here rather than pulled.
#
# Everything else about the container is unchanged, including the data and config
# volumes, so an existing proxy keeps its certificates when it is reinstalled onto
# this image.
on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/caddy-image.yml'
      - 'deploy/caddy/**'
  # Domains/HTTPS is optional — do not rebuild the proxy image on every product
  # release. Run by hand (or when deploy/caddy changes) when you need a fresh
  # GHCR image.
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pinqops-caddy

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Needed for the keyless cosign signature below.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # The major tag is what ProxyService pins, so a module addition reaches
      # existing servers on their next proxy reinstall. The dated tag is what makes
      # a specific build identifiable when something regresses.
      - name: Resolve tags
        id: tags
        run: |
          set -euo pipefail
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: deploy/caddy
          file: deploy/caddy/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:2
            ${{ env.IMAGE }}:2-${{ steps.tags.outputs.date }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Caddy with the modules pinqops needs (rate limiting, DNS-01 providers)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same discipline as the release binaries: the thing that ends up serving
      # every domain on someone's server should be traceable to the workflow that
      # produced it.
      - name: Sign the image
        run: cosign sign --yes "${{ env.IMAGE }}@${{ steps.push.outputs.digest }}"

      - name: Show how to verify
        run: |
          echo "Verify with:"
          echo "  cosign verify ${{ env.IMAGE }}:2 \\"
          echo "    --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.*' \\"
          echo "    --certificate-oidc-issuer https://token.actions.githubusercontent.com"
